# Scheme A — bundled-nginx profile only.
# ECS production uses Nginx Proxy Manager, not this file.
# NPM Proxy Host: yunrong.ink → http://web:3000. Do NOT add /api/v1 → api.
# This server only fronts Next (+ acme). /api/v1 stays on Next so the BFF
# can set Authorization: Bearer ${FIN_API_TOKEN}.

server {
  listen 80;
  server_name yunrong.ink www.yunrong.ink;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://web:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
